[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finteam"
version = "0.1.0"
description = "Multi-agent AI trading system using LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "alpaca-trade-api>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "ta>=0.11",
    "tiktoken>=0.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
